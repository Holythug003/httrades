<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TNICE Admin – OAuth 2.0</title>
<style>
  :root {
    --bg: #0b0e14; --card: #151922; --border: #252a36;
    --text: #e8eaed; --muted: #8b92a5; --green: #00c853;
    --red: #ff5252; --blue: #448aff; --orange: #ffab40; --accent: #c45c26;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .brandbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px; background: #fff; color: #111; }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-circle { width: 36px; height: 36px; border-radius: 50%; background: #1a1a1a; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; }
  .brand-name { font-weight: 800; font-size: 15px; }
  .brand-sub { font-size: 10px; color: #666; }
  .header-right { position: relative; }
  .account-pill { display: flex; align-items: center; gap: 8px; background: #f3f4f6; border-radius: 24px; padding: 6px 12px 6px 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .account-pill .coin { width: 22px; height: 22px; border-radius: 50%; background: #00a79e; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .mainnav { display: flex; gap: 2px; padding: 0 12px; background: #0f131a; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .mainnav a { display: flex; align-items: center; gap: 6px; padding: 12px 14px; color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; border-bottom: 2px solid transparent; }
  .mainnav a.active { color: #fff; border-bottom-color: var(--accent); background: rgba(196,92,38,.12); }
  .main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h3 { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
  .card .value { font-size: 20px; font-weight: 700; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .btn { background: var(--blue); color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .btn-green { background: var(--green); color: #000; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .log-box { background: #080a10; border: 1px solid var(--border); border-radius: 8px; padding: 12px; height: 220px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5; }
  .log-box .info { color: var(--muted); }
  .log-box .ok { color: var(--green); }
  .log-box .err { color: var(--red); }
  .log-box .warn { color: var(--orange); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.on { background: var(--green); }
  .status-dot.off { background: var(--red); }
</style>
</head>
<body>

<div class="brandbar">
  <div class="logo-wrap">
    <div class="logo-circle">TN</div>
    <div>
      <div class="brand-name">TNICE TRADES</div>
      <div class="brand-sub">OAuth 2.0 + PKCE</div>
    </div>
  </div>
  <div class="header-right">
    <div class="account-pill">
      <span class="coin">Đ</span>
      <span id="pillBalance">Not logged in</span>
    </div>
  </div>
</div>

<nav class="mainnav">
  <a href="#" class="active">Dashboard</a>
</nav>

<div class="main">
  <div class="grid">
    <div class="card">
      <h3>Status</h3>
      <div class="value" id="statusText"><span class="status-dot off"></span>Not connected</div>
      <div class="sub" id="statusSub">Click Log in with Deriv</div>
    </div>
    <div class="card">
      <h3>Access Token</h3>
      <div class="value" id="tokenPreview" style="font-size:13px; word-break:break-all;">—</div>
      <div class="sub">Short-lived OAuth token</div>
    </div>
  </div>

  <div style="margin-bottom:16px; display:flex; gap:8px; flex-wrap:wrap;">
    <button class="btn" onclick="startLogin()">Log in with Deriv</button>
    <button class="btn btn-green" onclick="testConnection()">Test Connection</button>
    <button class="btn btn-outline" onclick="logout()">Logout</button>
  </div>

  <h3 style="margin:12px 0 8px; font-size:14px;">Activity Log</h3>
  <div class="log-box" id="logBox"></div>
</div>

<script>
const CLIENT_ID = "34FywFYdRovCPnNKFukpx";          // ← your new App ID
const REDIRECT_URI = "https://ht-trades-production.up.railway.app/";
const SCOPES = "trade account_manage";

function log(msg, type = "info") {
  const box = document.getElementById("logBox");
  const line = document.createElement("div");
  line.className = type;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
  console.log(`[${type}]`, msg);
}

// ---------- PKCE helpers ----------
function generateRandomString(length = 64) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  let result = "";
  const array = new Uint8Array(length);
  crypto.getRandomValues(array);
  array.forEach(x => result += chars[x % chars.length]);
  return result;
}

async function sha256(plain) {
  const encoder = new TextEncoder();
  const data = encoder.encode(plain);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(hash)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

// ---------- Login ----------
async function startLogin() {
  const verifier = generateRandomString(64);
  const challenge = await sha256(verifier);
  const state = generateRandomString(32);

  sessionStorage.setItem("pkce_verifier", verifier);
  sessionStorage.setItem("oauth_state", state);

  const params = new URLSearchParams({
    response_type: "code",
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    state: state,
    code_challenge: challenge,
    code_challenge_method: "S256"
  });

  window.location.href = `https://auth.deriv.com/oauth2/auth?${params.toString()}`;
}

// ---------- Handle callback ----------
async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");

  if (error) {
    log("OAuth error: " + error, "err");
    return;
  }

  if (!code) return; // normal page load

  // Clean the URL
  window.history.replaceState({}, document.title, window.location.pathname);

  const savedState = sessionStorage.getItem("oauth_state");
  if (state !== savedState) {
    log("State mismatch – possible CSRF", "err");
    return;
  }

  const verifier = sessionStorage.getItem("pkce_verifier");
  if (!verifier) {
    log("Missing code_verifier", "err");
    return;
  }

  log("Exchanging code for access token...", "info");

  try {
    const res = await fetch("https://auth.deriv.com/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: CLIENT_ID,
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      })
    });

    const data = await res.json();

    if (!res.ok) {
      log("Token exchange failed: " + (data.error_description || data.error || res.status), "err");
      console.error(data);
      return;
    }

    // Success
    localStorage.setItem("deriv_access_token", data.access_token);
    if (data.refresh_token) localStorage.setItem("deriv_refresh_token", data.refresh_token);

    log("Login successful!", "ok");
    document.getElementById("tokenPreview").textContent = data.access_token.slice(0, 40) + "...";
    document.getElementById("statusText").innerHTML = `<span class="status-dot on"></span>Logged in`;
    document.getElementById("statusSub").textContent = "OAuth 2.0 token received";
    document.getElementById("pillBalance").textContent = "Logged in";

  } catch (e) {
    log("Network error during token exchange: " + e.message, "err");
  }
}

// ---------- Test the token ----------
async function testConnection() {
  const token = localStorage.getItem("deriv_access_token");
  if (!token) return log("No access token. Please log in first.", "err");

  log("Testing token against Deriv API...", "info");

  try {
    // Simple test – list accounts (new API)
    const res = await fetch("https://api.derivws.com/trading/v1/options/accounts", {
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
      }
    });

    const data = await res.json();
    if (!res.ok) {
      log("API test failed: " + res.status, "err");
      console.error(data);
      return;
    }

    log("Token is valid! Accounts received.", "ok");
    console.log(data);
  } catch (e) {
    log("Test error: " + e.message, "err");
  }
}

function logout() {
  localStorage.removeItem("deriv_access_token");
  localStorage.removeItem("deriv_refresh_token");
  document.getElementById("tokenPreview").textContent = "—";
  document.getElementById("statusText").innerHTML = `<span class="status-dot off"></span>Not connected`;
  document.getElementById("statusSub").textContent = "Click Log in with Deriv";
  document.getElementById("pillBalance").textContent = "Not logged in";
  log("Logged out", "warn");
}

// Start
handleCallback();
log("Ready. Click “Log in with Deriv”.", "info");
</script>
</body>
</html>
